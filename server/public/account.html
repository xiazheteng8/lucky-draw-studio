<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录与注册 · 瞎折腾摇奖吧</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/account.css?v=20261121-export2"><script type="module" src="/theme-runtime.js?v=20261121-export2"></script><script defer src="/account.js"></script><script defer src="/site-config.js"></script><link rel="stylesheet" href="/theme-redesign.css?v=20261104r1"><script defer src="/theme-redesign.js?v=20261104r1"></script><link rel="stylesheet" href="/module-design.css?v=20261104r8"><link rel="stylesheet" href="/spring-reference.css?v=20261104r7"></head><body class="account-page"><main class="account-shell"><a href="/" class="brand">✦ 瞎折腾摇奖吧</a><p class="eyebrow">YOUR ACCOUNT / YOUR CAMPAIGNS</p><h1>让幸运从这里开始</h1><p class="muted">创建页面对所有人开放；实际创建、开奖和查看我的活动需要登录。</p><p id="setupNotice" class="retention-note" hidden></p><p id="accountStatus" role="status" aria-live="polite"></p><section id="signedIn" class="panel" hidden><p id="accountIdentity"></p><a id="continueLink" href="/">继续创建 / 我的活动 ↗</a><button id="accountLogout" type="button">退出登录</button><a data-owner-only href="/owner" hidden>站长后台</a></section><div class="account-columns"><section class="panel"><h2>登录</h2><form id="loginForm" hidden><label for="loginUsername">用户名</label><input id="loginUsername" name="username" autocomplete="username" required maxlength="64"><label for="loginPassword">密码</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button type="submit" class="primary">登录</button></form><p id="passwordUnavailable" class="muted">本站未启用密码登录。</p></section><section id="registerPanel" class="panel" hidden><h2>注册账号</h2><p class="muted">注册码选填：有效码仅能使用一次，注册后自动认证；不填写则按未认证用户规则使用。</p><form id="registerForm"><label for="registerUsername">用户名</label><input id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="64" required><label for="registerPassword">密码（至少 10 位）</label><input id="registerPassword" name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required><label for="registrationCode">注册码（选填）</label><input id="registrationCode" name="registrationCode" maxlength="100" autocomplete="off" placeholder="有注册码则自动认证，无需填写邮箱或手机号"><div class="retention-note"><strong>未验证账号的数据保留规则</strong><p data-retention-policy>正在加载数据保留规则…</p><label class="consent"><input id="acceptRetention" type="checkbox" required disabled> 我已阅读并同意以上规则</label></div><button type="submit" class="primary">同意规则并注册</button></form></section></div><p><a href="/">← 返回公开创建页</a></p><noscript>登录与注册需要 JavaScript。请启用后刷新页面。</noscript></main></body></html>
