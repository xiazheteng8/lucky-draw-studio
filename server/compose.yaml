services:
  studio:
    build: .
    image: lucky-studio:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3010}:3000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      SETTINGS_ENV_PATH: /app/data/settings.env
      WECHAT_ENV_VERSION: ${WECHAT_ENV_VERSION:-release}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
