<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>现场互动 · 瞎折腾摇奖吧</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/interact.css"><link rel="stylesheet" href="/themes.css"><script type="module" src="/theme-runtime.js"></script><script defer src="/site-config.js"></script><link rel="stylesheet" href="/theme-redesign.css?v=20261104r1"><script defer src="/theme-redesign.js?v=20261104r1"></script><link rel="stylesheet" href="/module-design.css?v=20261104r8"><link rel="stylesheet" href="/spring-reference.css?v=20261104r7"></head><body><main class="phone"><header><img id="brandLogo" src="/default-logo.jpg" alt="活动标志"><p class="eyebrow">JOIN THE MOMENT</p><h1 id="eventTitle">现场互动</h1><p class="muted">送一句祝福，点亮现场的幸运时刻。</p></header><section class="panel"><section id="checkinPanel" hidden><p id="qualification" class="checkin-banner" role="status">请完成微信授权签到</p><img id="wechatAvatar" alt="微信头像" hidden style="width:64px;height:64px;border-radius:50%;border:2px solid white"><a id="authorizeWechat" class="primary" style="display:block;text-align:center;padding:14px;border-radius:10px">微信授权并签到</a></section><section id="customRegPanel" hidden style="margin-bottom:24px"><div style="background:rgba(20,184,166,0.12);border:1px solid #14b8a6;border-radius:12px;padding:14px;margin-bottom:12px;text-align:left"><p id="customRegStatus" style="font-weight:700;color:#2dd4bf;font-size:16px;margin:0 0 4px 0">🎫 扫码报名参与抽奖</p><p id="customRegSub" style="font-size:13px;color:#94a3b8;margin:0">填写姓名与编号即可加入本场抽奖名单</p></div><form id="customRegForm" style="display:grid;gap:10px;text-align:left"><label for="regName" style="font-size:14px;font-weight:600">姓名 <span style="color:#f43f5e">*</span></label><input id="regName" maxlength="24" required placeholder="请输入真实姓名或称呼" autocomplete="name" style="background:#071724;color:#e4f7ff;border:1px solid #31576b;border-radius:8px;padding:12px;font:inherit"><label for="regCode" style="font-size:14px;font-weight:600">编号（可选）</label><input id="regCode" maxlength="32" placeholder="学号 / 工号（填写则作为唯一标识）" style="background:#071724;color:#e4f7ff;border:1px solid #31576b;border-radius:8px;padding:12px;font:inherit"><label for="regText" style="font-size:14px;font-weight:600">我要发字幕</label><textarea id="regText" rows="2" maxlength="120" placeholder="发一句祝福或口号，随报名飘上等待大屏…" style="background:#071724;color:#e4f7ff;border:1px solid #31576b;border-radius:8px;padding:12px;font:inherit"></textarea><button class="primary" type="submit" id="regSubmitBtn" style="width:100%;margin-top:8px;padding:12px;font-size:16px">立即报名参与抽奖 ✨</button></form><div id="customRegSuccess" hidden style="background:#07271e;border:1px solid #10b981;border-radius:12px;padding:18px;text-align:center;margin-top:10px"><div style="font-size:32px;line-height:1;margin-bottom:8px">🎉</div><p style="font-size:17px;font-weight:700;color:#34d399;margin:0 0 6px 0">已成功报名本场抽奖！</p><p id="registeredInfo" style="font-size:14px;color:#a7f3d0;margin:0"></p></div></section><button id="sendHeart" class="heart" aria-label="发送爱心">♥</button><p class="heart-label">点击送出爱心 <span id="likeCount">0</span></p><form id="messageForm"><label for="nickname">你的昵称（可选）</label><input id="nickname" maxlength="24" placeholder="现场观众" autocomplete="nickname"><label for="message">想说点什么？</label><textarea id="message" rows="3" maxlength="120" required placeholder="祝大家好运，也祝自己中奖！"></textarea><small>最多 120 字，发送后会在等待大屏循环展示。</small><button class="primary" type="submit">发送到大屏 ✨</button></form><p id="phoneStatus" role="status" aria-live="polite">正在连接现场…</p></section><section class="panel return-entry"><button id="saveActivity" type="button">保存活动入口</button><input id="activityLink" readonly hidden aria-label="活动入口链接"><p id="returnHint" class="muted tiny">离开后可再次扫描大屏二维码，或打开保存的活动链接返回。</p><details id="recentActivities" hidden><summary>最近参与的活动</summary><div id="activityHistory"></div></details></section><div id="phoneHearts" aria-hidden="true"></div></main><script src="/interact.js"></script></body></html>
